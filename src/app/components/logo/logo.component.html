<a
  routerLink="/"
  hlmTooltip="Systatus.Live"
  class="flex items-center justify-center"
  [class]="inverted() ? textClass + ' text-[#FDFCFD]' : textClass + ' text-[#113455]'"
>
  <img
    [src]="inverted() ? '/logos/systatus-live-white.png' : '/logos/systatus-live.png'"
    alt="Logo"
    [width]="imgSize"
    [height]="imgSize"
  />
  @if (!iconOnly()) {
    <span class="ml-1 hidden sm:inline">Systatus<span class="text-emerald-500">.Live</span></span>
  }
</a>
