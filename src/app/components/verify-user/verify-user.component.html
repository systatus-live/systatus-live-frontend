<div>
  <p>We sent a verification code to {{ userEmail }}. To verify your account, enter the 6-digit code.</p>
  <form [formGroup]="form!" class="mt-3 flex justify-content-between">
    <p-inputotp [length]="6" formControlName="code" />
    <button pButton label="Submit code" class="p-button-contrast w-full ml-3" type="button" (click)="submit()" [disabled]="!form?.valid"></button>
  </form>
  <div class="mt-3">
    <p-button [label]="'Resend code' + (resendTimer == 0 ? '' : ' (wait ' + resendTimer + ' seconds)')" variant="text" severity="secondary" (click)="sendCode()" [disabled]="resendTimer > 0"></p-button>
  </div>
</div>
