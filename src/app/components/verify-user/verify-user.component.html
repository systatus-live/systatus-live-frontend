<div>
  <p>{{ 'verifyUserComponent.description' | translate: { email: userEmail } }}</p>
  <form [formGroup]="form!" class="mt-3 flex justify-content-between">
    <p-inputotp [length]="6" formControlName="code" />
    <button pButton label="{{ 'verifyUserComponent.submit' | translate }}" class="p-button-contrast w-full ml-3" type="button" (click)="submit()" [disabled]="!form?.valid"></button>
  </form>
  <div class="mt-3">
    <p-button [label]="'verifyUserComponent.resendCode' | translate:{ timer: resendTimer === 0 ? '' : ' (' + resendTimer + ')' }" variant="text" severity="secondary" (click)="sendCode()" [disabled]="resendTimer > 0"></p-button>
  </div>
</div>
