@if (confirmService.dialog()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="fixed inset-0 bg-black/80" (click)="confirmService.deny()"></div>
    <div class="bg-background relative z-50 w-full max-w-sm rounded-lg border p-6 shadow-lg mx-4">
      <h2 class="text-lg font-semibold">{{ confirmService.dialog()!.title }}</h2>
      <p class="text-muted-foreground mt-2 text-sm">{{ confirmService.dialog()!.text }}</p>
      <div class="mt-6 flex justify-end gap-2">
        <button hlmBtn variant="ghost" (click)="confirmService.deny()">Cancelar</button>
        <button hlmBtn variant="destructive" (click)="confirmService.confirm()">Continuar</button>
      </div>
    </div>
  </div>
}
