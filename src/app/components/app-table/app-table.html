<div #tableContainer hlmTableContainer class="rounded-md border overflow-y-auto" [style.max-height]="maxHeight()">
  <table hlmTable>
    <thead hlmTHead>
      <tr hlmTr>
        @for (col of columns(); track $index) {
          <th hlmTh>{{ col }}</th>
        }
      </tr>
    </thead>
    <tbody hlmTBody>
      @if (rows().length === 0) {
        <tr hlmTr>
          <td hlmTd [attr.colspan]="columns().length" class="h-24 text-center text-muted-foreground">
            {{ emptyMessage() }}
          </td>
        </tr>
      }
      @for (row of rows(); track $index) {
        <ng-container
          [ngTemplateOutlet]="rowTemplate()!"
          [ngTemplateOutletContext]="{ $implicit: row }"
        ></ng-container>
      }
    </tbody>
  </table>
  <div #sentinel class="h-1"></div>
</div>

@if (total() > 0) {
  <div class="flex items-center justify-between py-2">
    <small class="text-muted-foreground">{{ total() }} {{ totalLabel() }}</small>
  </div>
}
