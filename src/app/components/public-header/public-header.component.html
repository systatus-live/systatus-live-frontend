<div class="header-container flex justify-content-between align-items-center">
  <app-logo></app-logo>
  <div class="flex align-items-center">
    <div class="mr-2">
      <p-select [options]="languageList" [(ngModel)]="selectedLanguage" optionValue="code" optionLabel="language" (onChange)="onChangeLanguage($event.value)">
        <ng-template #selectedItem let-item>
          <div class="short-language-selected">
            {{ item.flag }}
          </div>
          <div class="language-selected">
            <span class="mr-2">{{ item.flag }}</span>
            <span>{{ item.language }}</span>
          </div>
        </ng-template>
        <ng-template let-item #item>
          <div>
            <span class="mr-2">{{ item.flag }}</span>
            <span>{{ item.language }}</span>
          </div>
        </ng-template>
      </p-select>
    </div>
    <div>
      <a routerLink="/auth/signin">
        <p-button label="{{ 'all.signin' | translate }}" severity="contrast" variant="outlined" />
      </a>
    </div>
  </div>
</div>
