<div id="how-it-works" class="py-24 bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center">
      <div class="inline-block rounded-full bg-[#4D9EFF]/10 px-4 py-1.5 mb-4">
        <p class="text-sm font-medium text-[#4D9EFF] tracking-wide uppercase">Como funciona</p>
      </div>
      <h2 class="text-3xl leading-8 font-extrabold tracking-tight text-gray-900 sm:text-4xl">
        Configurado em menos de 2 minutos
      </h2>
      <p class="mt-4 max-w-2xl text-xl text-gray-500 lg:mx-auto">
        Sem instalações, sem agentes, sem complicação. Só cole seu endpoint e nós cuidamos do resto.
      </p>
    </div>

    <div class="mt-16 relative">
      <!-- Connector line -->
      <div class="hidden lg:block absolute top-16 left-0 right-0 h-0.5 bg-gray-100" style="left: 16.66%; right: 16.66%;"></div>

      <div class="grid grid-cols-1 gap-12 lg:grid-cols-3 lg:gap-8">
        @for (step of steps; track step.step) {
          <div class="relative flex flex-col items-center text-center">
            <div class="relative z-10">
              <span class="inline-flex items-center justify-center p-4 rounded-2xl shadow-lg" [class]="step.color">
                <ng-container [ngComponentOutlet]="step.icon" [ngComponentOutletInputs]="{ size: 28, color: 'white' }" />
              </span>
            </div>
            <div class="mt-6">
              <span class="text-xs font-bold tracking-widest text-gray-400 uppercase">{{ step.step }}</span>
              <h3 class="mt-2 text-xl font-semibold text-gray-900">{{ step.title }}</h3>
              <p class="mt-3 text-gray-500 leading-relaxed">{{ step.description }}</p>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
