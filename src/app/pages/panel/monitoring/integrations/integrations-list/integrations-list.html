<div class="flex flex-col gap-4">
  <div class="flex items-center justify-between gap-4">
    <h1 class="text-base font-semibold">Integrações</h1>
    <form (ngSubmit)="onSubmitSearch()" [formGroup]="form" class="flex gap-2 w-full max-w-sm">
      <input hlmInput formControlName="search" placeholder="Pesquisar por nome ou endereço" class="flex-1" />
      <button hlmBtn type="submit" variant="outline">Buscar</button>
    </form>
    <button hlmBtn routerLink="/panel/monitoring/integrations/new">Nova Integração</button>
  </div>

  <app-table
    [columns]="['Integração', '']"
    [rows]="integrationList()"
    emptyMessage="Nenhuma integração encontrada."
    [total]="pagination().total"
    [page]="page()"
    [totalPages]="totalPages"
    totalLabel="integrações"
    (pageChange)="fetchPage($event, form.controls.search.value ?? '')"
  >
    <ng-template #rowTemplate let-integration>
      <tr hlmTr class="cursor-pointer" (click)="router.navigate(['/panel/monitoring/integrations/edit', integration.id])">
        <td hlmTd>
          <div class="flex items-center gap-2.5">
            <img [src]="getPlatformLogo(integration.chatPlatform)" alt="" width="16" height="16" class="shrink-0" />
            <div class="flex flex-col justify-center overflow-hidden">
              <span class="font-medium">{{ integration.name }}</span>
              <small class="text-muted-foreground overflow-hidden whitespace-nowrap text-ellipsis">
                {{ integration.chatPlatform }} • {{ integration.address }}
              </small>
            </div>
          </div>
        </td>
        <td hlmTd>
          <div class="flex justify-end" (click)="$event.stopPropagation()">
            <button hlmBtn variant="ghost" class="h-8 w-8 p-0" [hlmDropdownMenuTrigger]="actionsMenu">
              <ng-icon name="lucideEllipsis" class="size-4" />
            </button>
            <ng-template #actionsMenu>
              <div hlmDropdownMenu>
                <div hlmDropdownMenuLabel>Ações</div>
                <button hlmDropdownMenuItem (triggered)="router.navigate(['/panel/monitoring/integrations/edit', integration.id])">
                  Editar
                </button>
                <button hlmDropdownMenuItem (triggered)="handleValidate(integration.id)">
                  Testar integração
                </button>
                <button hlmDropdownMenuItem (triggered)="copyToClipboard(integration.address)">
                  Copiar URL
                </button>
                <hlm-dropdown-menu-separator />
                <button hlmDropdownMenuItem class="text-destructive focus:text-destructive" (triggered)="handleDelete(integration.id)">
                  Excluir
                </button>
              </div>
            </ng-template>
          </div>
        </td>
      </tr>
    </ng-template>
  </app-table>
</div>
