<div class="min-h-screen flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="mx-auto w-full max-w-md">
    <section hlmCard>
      <div hlmCardHeader class="items-center text-center">
        <app-logo [inverted]="true" />
        <h2 class="mt-3 text-xl font-semibold leading-none">Criar Conta</h2>
        <p hlmCardDescription>Quase lá... preencha os dados abaixo para começar</p>
      </div>
      <div hlmCardContent class="mt-3">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-3">
          <div class="flex flex-col gap-1">
            <label hlmLabel>Nome <span class="text-destructive">*</span></label>
            <input hlmInput type="text" formControlName="name" placeholder="Nome completo" />
          </div>
          <div class="flex flex-col gap-1">
            <label hlmLabel>E-mail <span class="text-destructive">*</span></label>
            <input hlmInput type="email" formControlName="email" placeholder="seu&#64;email.com" />
          </div>
          @if (!authFlow()?.signUpSignInFlow) {
            <div class="flex flex-col gap-1">
              <label hlmLabel>Senha <span class="text-destructive">*</span></label>
              <input hlmInput type="password" formControlName="password" />
            </div>
            <div class="flex flex-col gap-1">
              <label hlmLabel>Confirmar Senha <span class="text-destructive">*</span></label>
              <input hlmInput type="password" formControlName="confirmPassword" />
            </div>
          }
          <div class="flex flex-col gap-1">
            <label hlmLabel>Onde você conheceu o Systatus?</label>
            <div hlmSelect class="w-full"
              [value]="form.controls.discovery.value ?? ''"
              [itemToString]="discoveryItemToString"
              (valueChange)="form.controls.discovery.setValue($event ?? null)">
              <hlm-select-trigger class="w-full">
                <hlm-select-value placeholder="Selecione uma opção" />
              </hlm-select-trigger>
              <ng-template hlmSelectPortal>
                <hlm-select-content>
                  @for (option of discoveryList; track option.id) {
                    <hlm-select-item [value]="option.id">{{ option.description }}</hlm-select-item>
                  }
                </hlm-select-content>
              </ng-template>
            </div>
          </div>
          <div class="flex items-start gap-2 my-4">
            <hlm-checkbox formControlName="acceptTerms" id="acceptTerms" />
            <label for="acceptTerms" class="text-sm text-muted-foreground cursor-pointer leading-snug">
              Eu aceito os
              <a routerLink="/agreements/terms-of-use" target="_blank" class="font-medium underline-offset-4 hover:underline text-foreground">Termos de Uso</a>
              e a
              <a routerLink="/agreements/privacy-policy" target="_blank" class="font-medium underline-offset-4 hover:underline text-foreground">Política de Privacidade</a>
            </label>
          </div>
          <button hlmBtn type="submit" class="w-full">Criar Conta</button>
          <p class="text-center text-sm text-muted-foreground">
            Já possui uma conta?
            <a routerLink="/auth/signin" class="font-medium underline-offset-4 hover:underline text-foreground">Entrar</a>
          </p>
        </form>
      </div>
    </section>
  </div>
</div>
