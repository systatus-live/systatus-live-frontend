<div class="min-h-screen flex flex-col items-center justify-center py-12 px-4 sm:px-6">
  <div class="w-full max-w-md">

    <!-- Logo + heading above card -->
    <div class="flex flex-col items-center text-center mb-7">
      <app-logo [inverted]="true" />
      <h2 class="mt-4 text-xl font-semibold">Criar conta</h2>
      <p class="mt-1.5 text-sm text-muted-foreground">Preencha os dados abaixo para começar</p>
    </div>

    <!-- Form card -->
    <div class="bg-[#141B24] rounded-2xl border border-white/8 shadow-[0_25px_50px_-12px_rgb(0_0_0_/_0.5)] p-7">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

        <div class="flex flex-col gap-1.5">
          <label hlmLabel>Nome <span class="text-destructive">*</span></label>
          <input hlmInput type="text" formControlName="name" placeholder="Nome completo" />
        </div>

        <div class="flex flex-col gap-1.5">
          <label hlmLabel>E-mail <span class="text-destructive">*</span></label>
          <input hlmInput type="email" formControlName="email" placeholder="seu&#64;email.com" />
        </div>

        @if (!authFlow()?.signUpSignInFlow) {
          <div class="flex flex-col gap-1.5">
            <label hlmLabel>Senha <span class="text-destructive">*</span></label>
            <input hlmInput type="password" formControlName="password" />
          </div>
          <div class="flex flex-col gap-1.5">
            <label hlmLabel>Confirmar senha <span class="text-destructive">*</span></label>
            <input hlmInput type="password" formControlName="confirmPassword" />
          </div>
        }

        <div class="flex flex-col gap-1.5">
          <label hlmLabel>Onde você conheceu o Systatus?</label>
          <div hlmSelect class="w-full"
            [value]="form.controls.discovery.value ?? ''"
            [itemToString]="discoveryItemToString"
            (valueChange)="form.controls.discovery.setValue($event ?? null)">
            <hlm-select-trigger class="w-full">
              <hlm-select-value placeholder="Selecione uma opção" />
            </hlm-select-trigger>
            <ng-template hlmSelectPortal>
              <hlm-select-content>
                @for (option of discoveryList; track option.id) {
                  <hlm-select-item [value]="option.id">{{ option.description }}</hlm-select-item>
                }
              </hlm-select-content>
            </ng-template>
          </div>
        </div>

        <div class="flex items-start gap-2.5 pt-1">
          <hlm-checkbox formControlName="acceptTerms" id="acceptTerms" class="mt-0.5 shrink-0" />
          <label for="acceptTerms" class="text-sm text-muted-foreground cursor-pointer leading-snug">
            Eu aceito os
            <a routerLink="/agreements/terms-of-use" target="_blank" class="font-medium text-foreground underline-offset-4 hover:underline">Termos de Uso</a>
            e a
            <a routerLink="/agreements/privacy-policy" target="_blank" class="font-medium text-foreground underline-offset-4 hover:underline">Política de Privacidade</a>
          </label>
        </div>

        <button hlmBtn type="submit" class="w-full bg-lp-green hover:bg-lp-green-hover text-white border-0">Criar conta</button>

        <p class="text-center text-sm text-muted-foreground pt-1">
          Já possui uma conta?
          <a routerLink="/auth/signin" class="font-medium text-foreground underline-offset-4 hover:underline">Entrar</a>
        </p>

      </form>
    </div>

  </div>
</div>
