<div class="min-h-screen bg-muted/40 flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="mx-auto w-full max-w-md">
    <section hlmCard>
      <div hlmCardHeader class="items-center text-center">
        <app-logo />
        <h2 class="mt-2 text-xl font-semibold leading-none">Redefinir Senha</h2>
        <p hlmCardDescription>Crie uma nova senha para sua conta</p>
      </div>
      <div hlmCardContent>
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-3">
          <div class="flex flex-col gap-1">
            <label hlmLabel>Senha <span class="text-destructive">*</span></label>
            <input hlmInput type="password" formControlName="password" />
          </div>
          <div class="flex flex-col gap-1">
            <label hlmLabel>Confirmar Senha <span class="text-destructive">*</span></label>
            <input hlmInput type="password" formControlName="confirmPassword" />
          </div>
          <button hlmBtn type="submit" class="w-full">Redefinir Senha</button>
          <p class="text-center text-sm text-muted-foreground">
            Cancelar redefinição?
            <a routerLink="/auth/signin" class="font-medium underline-offset-4 hover:underline text-foreground">Entrar</a>
          </p>
        </form>
      </div>
    </section>
  </div>
</div>
