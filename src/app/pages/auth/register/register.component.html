<div class="flex justify-content-center align-items-center h-full grid grid-nogutter">
  <div class="col-12 md:col-4 lg:col-3">
    <p-card>
      <div class="flex flex-column align-items-center mb-4">
        <div class="mb-4 flex align-items-center">
          <img src="images/systatus-live-icon.png" width="30" class="mr-2">
          <h3>Systatus Live</h3>
        </div>
        <h2 class="mb-2 text-center">Create your account</h2>
        <p class="text-center text-sm">Start monitoring your systems today</p>
      </div>
      <form>
        <!-- Name -->
        <p-iftalabel class="mb-3">
          <input pInputText id="name" pSize="small" />
          <label for="name">Full name *</label>
        </p-iftalabel>
        <!-- E-mail -->
        <p-iftalabel class="mb-3">
          <input pInputText id="email" pSize="small" />
          <label for="email">E-mail *</label>
        </p-iftalabel>
        <!-- Password -->
        <p-iftalabel class="mb-3">
          <p-password id="password" [feedback]="true" pSize="small" [toggleMask]="true">
            <ng-template #footer>
              <p-divider />
              <ul class="pl-2 ml-2 my-0 leading-normal">
                <li>At least one lowercase</li>
                <li>At least one uppercase</li>
                <li>At least one numeric</li>
                <li>Minimum 8 characters</li>
              </ul>
            </ng-template>
          </p-password>
          <label for="password">Password *</label>
        </p-iftalabel>
        <!-- Confirm password -->
        <p-iftalabel class="mb-3">
          <p-password id="confirmPassword" [feedback]="false" pSize="small" [toggleMask]="true" />
          <label for="confirmPassword">Confirm password *</label>
        </p-iftalabel>
        <!-- Discovery -->
        <p-iftalabel class="mb-3">
          <p-select id="discovery" [options]="discoveryList" optionValue="code" optionLabel="name" placeholder="Optional" [checkmark]="true" />
          <label for="discovery">How did you hear about us? (optional)</label>
        </p-iftalabel>
        <!-- Actions -->
        <div class="flex align-items-center mb-3">
          <p-checkbox [binary]="true" inputId="acceptTerms" />
          <label for="acceptTerms" class="ml-2 text-sm">I agree to the <a href="/agreements/terms-of-service">Terms of Service</a> and <a href="/agreements/privacy-policy">Privacy Policy</a></label>
        </div>
        <div>
          <button pButton label="Create account" class="w-full p-button-contrast" type="button"></button>
        </div>
        <div class="text-center mt-3">
          <p class="text-sm">Already have an account? <a href="/auth/login">Sign in</a></p>
        </div>
      </form>
    </p-card>
  </div>
</div>
