<div class="flex justify-content-center align-items-center h-full grid grid-nogutter">
  <div class="col-12 md:col-4 lg:col-3">
    <p-card>
      <div class="flex flex-column align-items-center mb-4">
        <app-logo></app-logo>
        <h2 class="mt-4 mb-2 text-center">Welcome back</h2>
        <p class="text-center text-sm">Start monitoring your systems today</p>
      </div>
      <div class="flex justify-content-center">
        <div id="google-button"></div>
      </div>
      <div class="my-3">
        <p-divider align="center"><span class="text-sm">or</span></p-divider>
      </div>
      <form [formGroup]="form!">
        <!-- E-mail -->
        <p-iftalabel class="mb-3">
          <input pInputText id="email" formControlName="email" />
          <label for="email">E-mail *</label>
        </p-iftalabel>
        <!-- Password -->
        <p-iftalabel class="mb-3">
          <p-password id="password" formControlName="password" [feedback]="false" [toggleMask]="true" />
          <label for="password">Password *</label>
        </p-iftalabel>
        <!-- Actions -->
        <div class="flex align-items-center justify-content-between mb-3">
          <div class="flex align-items-center">
            <p-checkbox [binary]="true" inputId="rememberLogin" [(ngModel)]="rememberLogin" [ngModelOptions]="{ standalone: true }" />
            <label for="rememberLogin" class="ml-2 text-sm">Remember me</label>
          </div>
          <p class="text-sm"><a href="#">Forgot password?</a></p>
        </div>
        <div>
          <button pButton label="Sign In" class="w-full p-button-contrast" type="button" (click)="signinWithPassword()" [disabled]="!form?.valid"></button>
        </div>
        <div class="text-center mt-3">
          <p class="text-sm">Don't have an account? <a href="/auth/signup">Sign up free</a></p>
        </div>
      </form>
    </p-card>
  </div>
</div>
