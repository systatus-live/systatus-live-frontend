<div class="min-h-screen flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="mx-auto w-full max-w-md">
    <section hlmCard>
      <div hlmCardHeader class="items-center text-center">
        <app-logo [inverted]="true" />
        <h2 class="mt-2 text-xl font-semibold leading-none">Entrar</h2>
      </div>
      <div hlmCardContent>
        <div class="space-y-5">
          <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-3">
            <div class="flex flex-col gap-1">
              <label hlmLabel for="email">E-mail <span class="text-destructive">*</span></label>
              <input hlmInput id="email" type="email" formControlName="email" placeholder="seu&#64;email.com" />
            </div>
            <div class="flex flex-col gap-1">
              <div class="flex items-center justify-between">
                <label hlmLabel for="password">Senha <span class="text-destructive">*</span></label>
                <a routerLink="/auth/forgot-password" class="text-sm underline-offset-4 hover:underline text-muted-foreground">Esqueci minha senha</a>
              </div>
              <input hlmInput id="password" type="password" formControlName="password" />
            </div>
            <div class="flex items-center gap-2">
              <hlm-checkbox formControlName="keepConected" id="keepConected" />
              <label for="keepConected" class="text-sm text-muted-foreground cursor-pointer">Manter conectado</label>
            </div>
            <button hlmBtn type="submit" class="w-full">Entrar</button>
          </form>
          <div class="relative">
            <div class="border-t"></div>
            <span class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-card px-2 text-xs text-muted-foreground">ou</span>
          </div>
          <div class="flex justify-center" style="color-scheme: light">
            @if (isBrowser) {
              <div id="google-signin"></div>
            }
          </div>
          <p class="text-center text-sm text-muted-foreground">
            Não possui uma conta?
            <a routerLink="/auth/signup" class="font-medium underline-offset-4 hover:underline">Crie uma gratuitamente</a>
          </p>
        </div>
      </div>
    </section>
  </div>
</div>
