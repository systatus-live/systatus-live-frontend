<div class="min-h-screen flex flex-col items-center justify-center py-12 px-4 sm:px-6">
  <div class="w-full max-w-md">

    <div class="flex flex-col items-center text-center mb-7">
      <app-logo [inverted]="true" />
      <h2 class="mt-4 text-xl font-semibold">Entrar</h2>
      <p class="mt-1.5 text-sm text-muted-foreground">Acesse sua conta para continuar</p>
    </div>

    <div class="bg-[#141B24] rounded-2xl border border-white/8 shadow-[0_25px_50px_-12px_rgb(0_0_0_/_0.5)] p-7">
      <div class="space-y-4">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
          <div class="flex flex-col gap-1.5">
            <label hlmLabel for="email">E-mail <span class="text-destructive">*</span></label>
            <input hlmInput id="email" type="email" formControlName="email" placeholder="seu&#64;email.com" />
          </div>
          <div class="flex flex-col gap-1.5">
            <div class="flex items-center justify-between">
              <label hlmLabel for="password">Senha <span class="text-destructive">*</span></label>
              <a routerLink="/auth/forgot-password" class="text-sm underline-offset-4 hover:underline text-muted-foreground">Esqueci minha senha</a>
            </div>
            <input hlmInput id="password" type="password" formControlName="password" />
          </div>
          <div class="flex items-center gap-2">
            <hlm-checkbox formControlName="keepConected" id="keepConected" />
            <label for="keepConected" class="text-sm text-muted-foreground cursor-pointer">Manter conectado</label>
          </div>
          <button hlmBtn type="submit" class="w-full bg-lp-green hover:bg-lp-green-hover text-white border-0">Entrar</button>
        </form>
        <div class="relative">
          <div class="border-t border-white/8"></div>
          <span class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-[#141B24] px-2 text-xs text-muted-foreground">ou</span>
        </div>
        <div class="flex justify-center" style="color-scheme: light">
          <div id="google-signin"></div>
        </div>
        <p class="text-center text-sm text-muted-foreground pt-1">
          Não possui uma conta?
          <a routerLink="/auth/signup" class="font-medium text-foreground underline-offset-4 hover:underline">Crie uma gratuitamente</a>
        </p>
      </div>
    </div>

  </div>
</div>
