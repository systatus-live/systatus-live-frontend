<div class="min-h-screen flex flex-col items-center justify-center py-12 px-4 sm:px-6">
  <div class="w-full max-w-md">

    <div class="flex flex-col items-center text-center mb-7">
      <app-logo [inverted]="true" />
      <h2 class="mt-4 text-xl font-semibold">Esqueceu a senha?</h2>
      <p class="mt-1.5 text-sm text-muted-foreground">Insira seu e-mail para receber um link de redefinição</p>
    </div>

    <div class="bg-[#141B24] rounded-2xl border border-white/8 shadow-[0_25px_50px_-12px_rgb(0_0_0_/_0.5)] p-7">
      @if (isSubmitted()) {
        <div class="flex flex-col items-center gap-4 py-6 text-center">
          <div class="flex items-center justify-center h-12 w-12 rounded-full bg-green-500/15">
            <ng-icon name="lucideCheck" class="h-6 w-6 text-green-500" />
          </div>
          <p class="text-sm text-muted-foreground">{{ message() }}</p>
          <a routerLink="/auth/signin" class="text-sm font-medium text-muted-foreground underline-offset-4 hover:underline">
            Voltar ao login
          </a>
        </div>
      } @else {
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
          <div class="flex flex-col gap-1.5">
            <label hlmLabel for="email">E-mail <span class="text-destructive">*</span></label>
            <input hlmInput id="email" type="email" formControlName="email" placeholder="seu&#64;email.com" />
          </div>
          <button hlmBtn type="submit" class="w-full bg-lp-green hover:bg-lp-green-hover text-white border-0">
            Enviar link
          </button>
          <p class="text-center text-sm text-muted-foreground pt-1">
            Lembrou a senha?
            <a routerLink="/auth/signin" class="font-medium text-foreground underline-offset-4 hover:underline">Entrar</a>
          </p>
        </form>
      }
    </div>

  </div>
</div>
