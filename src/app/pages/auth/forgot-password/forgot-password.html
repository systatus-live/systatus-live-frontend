<div class="min-h-screen bg-muted/40 flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="mx-auto w-full max-w-md">
    <section hlmCard>
      <div hlmCardHeader class="items-center text-center">
        <app-logo />
        <h2 class="mt-2 text-xl font-semibold leading-none">Esqueceu a Senha?</h2>
        <p hlmCardDescription>Insira seu e-mail para receber um link de redefinição de senha</p>
      </div>
      <div hlmCardContent>
        @if (isSubmitted()) {
          <div class="flex flex-col items-center gap-4 py-8 text-center">
            <div class="flex items-center justify-center h-16 w-16 rounded-full bg-green-100">
              <ng-icon name="lucideCheck" class="h-8 w-8 text-green-600" />
            </div>
            <p class="text-sm text-muted-foreground">{{ message() }}</p>
          </div>
        } @else {
          <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-3">
            <div class="flex flex-col gap-1">
              <label hlmLabel for="email">E-mail <span class="text-destructive">*</span></label>
              <input hlmInput id="email" type="email" formControlName="email" placeholder="seu&#64;email.com" />
            </div>
            <button hlmBtn type="submit" class="w-full">Enviar Link</button>
            <p class="text-center text-sm text-muted-foreground">
              Lembrou a senha?
              <a routerLink="/auth/signin" class="font-medium underline-offset-4 hover:underline text-foreground">Entrar na sua conta</a>
            </p>
          </form>
        }
      </div>
    </section>
  </div>
</div>
