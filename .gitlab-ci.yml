stages:
  - deploy-systatus-web
  - deploy-systatus-web-hml

deploy-systatus-web:
  environment:
    name: production
  stage: deploy-systatus-web
  tags:
    - systatus-runner
  script:
    - ssh-keyscan $DEPLOY_HOST >> /home/gitlab-runner/.ssh/known_hosts
    - docker build --no-cache -f Dockerfile.prod -t systatus-live-web:latest .
    - docker save systatus-live-web:latest | gzip | ssh $DEPLOY_USER@$DEPLOY_HOST "docker load"
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST "cat > $DEPLOY_DIR/.env << 'EOF'
      NODE_ENV=$NODE_ENV
      EOF"
    - scp docker-compose.yml $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/docker-compose.yml
    - ssh $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_DIR && docker compose up -d systatus-live-web"
    - docker image prune -f
  only:
    - master

deploy-systatus-web-hml:
  environment:
    name: homolog
  stage: deploy-systatus-web-hml
  tags:
    - systatus-runner
  script:
    - docker compose build --no-cache systatus-live-web-hml
    - docker compose down systatus-live-web-hml
    - docker compose up -d systatus-live-web-hml
    - docker image prune -f
  only:
    - homolog
