stages:
  - deploy-systatus-web
  - deploy-systatus-web-hml

deploy-systatus-web:
  environment:
    name: production
  stage: deploy-systatus-web
  tags:
    - systatus-runner
  script:
    - ssh-keyscan $DEPLOY_HOST >> /home/gitlab-runner/.ssh/known_hosts
    - docker build -f Dockerfile.hml -t systatus-live-web-hml:latest .
    - docker save systatus-live-web-hml:latest | gzip | ssh $DEPLOY_USER@$DEPLOY_HOST "docker load"
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST "cat > $HML_DEPLOY_DIR/.env << 'EOF'
      NODE_ENV=$NODE_ENV
      EOF"
    - ssh $DEPLOY_USER@$DEPLOY_HOST "cd $HML_DEPLOY_DIR && docker compose up -d web-hml"
    - docker image prune -f
  only:
    - master

deploy-systatus-web-hml:
  environment:
    name: homolog
  stage: deploy-systatus-web-hml
  tags:
    - systatus-runner
  script:
    - docker compose build --no-cache web
    - docker compose down web
    - docker compose up -d web
    - docker image prune -f
  only:
    - homolog
