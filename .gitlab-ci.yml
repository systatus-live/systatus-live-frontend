stages:
  - deploy-systatus-web
  - deploy-systatus-web-hml

deploy-systatus-web:
  environment:
    name: production
  stage: deploy-systatus-web
  tags:
    - systatus-runner
  script:
    - docker compose build --no-cache web
    - docker compose down web
    - docker compose up -d web
    - docker image prune -f
  only:
    - master

deploy-systatus-web-hml:
  environment:
    name: homolog
  stage: deploy-systatus-web-hml
  tags:
    - systatus-runner
  script:
    - mkdir -p ~/.ssh
    - ssh-keyscan $HML_DEPLOY_HOST >> ~/.ssh/known_hosts
    - docker build -f Dockerfile.hml -t systatus-live-web-hml:latest .
    - docker save systatus-live-web-hml:latest | gzip | ssh $HML_DEPLOY_USER@$HML_DEPLOY_HOST "docker load"
    - ssh $HML_DEPLOY_USER@$HML_DEPLOY_HOST "cd $HML_DEPLOY_DIR && docker compose up -d web-hml"
    - docker image prune -f
  only:
    - homolog
