services:
  app:
    image: systatus-live-web:latest
    container_name: systatus-live-web
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4002:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"
    restart: unless-stopped
