services:
  web:
    image: systatus-live-web:latest
    container_name: systatus-live-web
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "4002:80"
    environment:
      NODE_ENV: ${NODE_ENV}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"
    restart: unless-stopped

  web-hml:
    image: systatus-live-web-hml:latest
    container_name: systatus-live-web-hml
    build:
      context: .
      dockerfile: Dockerfile.hml
    ports:
      - "4001:80"
    environment:
      NODE_ENV: ${NODE_ENV}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"
    restart: unless-stopped
