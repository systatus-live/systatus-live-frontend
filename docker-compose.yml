services:
  systatus-live-web:
    image: systatus-live-web:latest
    container_name: systatus-live-web
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "4002:80"
    environment:
      NODE_ENV: ${NODE_ENV}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"
    restart: unless-stopped
